name: Playwright Tests

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Post to Slack even if nothing failed, to check the message'
        type: boolean
        default: false

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    env:
      DECEASED_NAME: ${{ vars.DECEASED_NAME }}
      HEIR_NAME: ${{ vars.HEIR_NAME }}
      HEIR_SSN: ${{ vars.HEIR_SSN }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.15.0' # Pins exact version to avoid zip extraction bug
          cache: npm # built-in npm cache, keyed on package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the resolved Playwright version, NOT the lockfile hash,
          # so a cache hit never restores browsers that mismatch the installed version.
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install browsers + system deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob

      # Each shard uploads its blob report for the merge job to consume.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      # Traces are only emitted on failure when the config uses
      # `trace: 'on-first-retry'` (or similar). Upload them only when relevant.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  merge-report:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    # Surfaced to the notify-slack job so the message can carry result counts.
    outputs:
      available: ${{ steps.stats.outputs.available }}
      passed: ${{ steps.stats.outputs.passed }}
      failed: ${{ steps.stats.outputs.failed }}
      flaky: ${{ steps.stats.outputs.flaky }}
      failed_tests: ${{ steps.stats.outputs.failed_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # Config file rather than --reporter=html,json so the JSON lands in a
      # file instead of stdout. See playwright.merge.config.ts.
      - name: Merge into HTML + JSON reports
        run: npx playwright merge-reports --config playwright.merge.config.ts ./all-blob-reports

      - name: Extract result counts
        id: stats
        run: node .github/scripts/report-stats.js merged-report.json >> "$GITHUB_OUTPUT"

      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  notify-slack:
    name: Notify Slack
    needs: [test, merge-report]
    # Fire on a genuine failure — not when the run was cancelled — or when
    # dispatched with force_notify to check the message itself.
    if: ${{ !cancelled() && (needs.test.result == 'failure' || needs.merge-report.result == 'failure' || inputs.force_notify) }}
    runs-on: ubuntu-latest
    env:
      # `secrets` is not available in `if:`, so it is mapped here and the
      # presence check happens in a step instead.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Check webhook is configured
        id: check
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SLACK_WEBHOOK_URL is not set — skipping the Slack notification."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build result summary
        id: summary
        env:
          AVAILABLE: ${{ needs.merge-report.outputs.available }}
          PASSED: ${{ needs.merge-report.outputs.passed }}
          FAILED: ${{ needs.merge-report.outputs.failed }}
          FLAKY: ${{ needs.merge-report.outputs.flaky }}
          TEST_RESULT: ${{ needs.test.result }}
          MERGE_RESULT: ${{ needs.merge-report.result }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$AVAILABLE" = "true" ]; then
            echo "line=*${PASSED}* passed · *${FAILED}* failed · *${FLAKY}* flaky" >> "$GITHUB_OUTPUT"
          else
            echo "line=_Result counts unavailable — the report merge did not complete._" >> "$GITHUB_OUTPUT"
          fi

          # A forced notification on a green run must not look like a real
          # alert, or someone will go chasing a failure that never happened.
          if [ "$TEST_RESULT" = "failure" ] || [ "$MERGE_RESULT" = "failure" ]; then
            echo "header=🔴 Playwright Tests — FAILED" >> "$GITHUB_OUTPUT"
            echo "fallback=🔴 Playwright Tests failed — run #${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "header=🧪 Playwright Tests — test notification" >> "$GITHUB_OUTPUT"
            echo "fallback=🧪 Playwright Tests test notification — run #${RUN_NUMBER}, nothing failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        if: steps.check.outputs.configured == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.summary.outputs.fallback }}",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "${{ steps.summary.outputs.header }}" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Run*\n#${{ github.run_number }} (${{ github.event_name }})" },
                    { "type": "mrkdwn", "text": "*Results*\n${{ steps.summary.outputs.line }}" }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Failed tests*\n${{ needs.merge-report.outputs.failed_tests }}" }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View run & download report" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "danger"
                    }
                  ]
                }
              ]
            }
