name: End-to-End Tests
# Run Playwright end-to-end tests on a schedule and on demand, with Slack notifications for failures.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Post to Slack even if nothing failed, to check the message'
        type: boolean
        default: false

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    env:
      DECEASED_NAME: ${{ vars.DECEASED_NAME }}
      HEIR_NAME: ${{ vars.HEIR_NAME }}
      HEIR_SSN: ${{ vars.HEIR_SSN }}
      HEIR2_SSN: ${{ vars.HEIR2_SSN }}
      HEIR3_SSN: ${{ vars.HEIR3_SSN }}
      HEIR4_SSN: ${{ vars.HEIR4_SSN }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.15.0' # Pins exact version to avoid zip extraction bug
          cache: npm # built-in npm cache, keyed on package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the resolved Playwright version, NOT the lockfile hash,
          # so a cache hit never restores browsers that mismatch the installed version.
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install browsers + system deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob

      # Each shard uploads its blob report for the merge job to consume.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      # Traces are only emitted on failure when the config uses
      # `trace: 'on-first-retry'` (or similar). Upload them only when relevant.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  merge-report:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    # Surfaced to the notify-slack job so the message can carry result counts.
    outputs:
      available: ${{ steps.stats.outputs.available }}
      passed: ${{ steps.stats.outputs.passed }}
      failed: ${{ steps.stats.outputs.failed }}
      flaky: ${{ steps.stats.outputs.flaky }}
      failures: ${{ steps.stats.outputs.failures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # Config file rather than --reporter=html,json so the JSON lands in a
      # file instead of stdout. See playwright.merge.config.ts.
      - name: Merge into HTML + JSON reports
        run: npx playwright merge-reports --config playwright.merge.config.ts ./all-blob-reports

      - name: Extract result counts
        id: stats
        run: node .github/scripts/report-stats.js merged-report.json >> "$GITHUB_OUTPUT"

      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # A failed run's report is published to GitHub Pages, so the Slack message can
  # link straight to it instead of to an artifact that has to be downloaded.
  # Each publish replaces the previous one, so the page shows the latest failure.
  publish-report:
    name: Publish report
    needs: [test, merge-report]
    if: ${{ !cancelled() && needs.merge-report.result == 'success' && (needs.test.result == 'failure' || inputs.force_notify) }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download HTML report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: playwright-report
          path: playwright-report

      # The site is public. Traces record the heirs' logged-in requests,
      # session cookies included, so they stay in the run's artifacts only.
      - name: Leave out traces
        run: find playwright-report -name '*.zip' -print -delete

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playwright-report

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify-slack:
    name: Notify Slack
    needs: [test, merge-report, publish-report]
    # Fire on a genuine failure — not when the run was cancelled — or when
    # dispatched with force_notify to check the message itself.
    if: ${{ !cancelled() && (needs.test.result == 'failure' || needs.merge-report.result == 'failure' || inputs.force_notify) }}
    runs-on: ubuntu-latest
    env:
      # `secrets` is not available in `if:`, so it is mapped here and the
      # presence check happens in a step instead.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Check webhook is configured
        id: check
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SLACK_WEBHOOK_URL is not set — skipping the Slack notification."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build result summary
        id: summary
        env:
          AVAILABLE: ${{ needs.merge-report.outputs.available }}
          PASSED: ${{ needs.merge-report.outputs.passed }}
          FAILED: ${{ needs.merge-report.outputs.failed }}
          FLAKY: ${{ needs.merge-report.outputs.flaky }}
          FAILURES: ${{ needs.merge-report.outputs.failures }}
          TEST_RESULT: ${{ needs.test.result }}
          MERGE_RESULT: ${{ needs.merge-report.result }}
          RUN_NUMBER: ${{ github.run_number }}
          REPORT_URL: ${{ needs.publish-report.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Link to the published report when there is one; the run is linked
          # either way, for the log and the traces.
          RUN_BUTTON="{ \"type\": \"button\", \"text\": { \"type\": \"plain_text\", \"text\": \"View run\" }, \"url\": \"${RUN_URL}\" }"
          if [ -n "$REPORT_URL" ]; then
            echo "buttons=[{ \"type\": \"button\", \"text\": { \"type\": \"plain_text\", \"text\": \"Open report\" }, \"url\": \"${REPORT_URL}\", \"style\": \"danger\" }, ${RUN_BUTTON}]" >> "$GITHUB_OUTPUT"
          else
            echo "buttons=[${RUN_BUTTON}]" >> "$GITHUB_OUTPUT"
          fi

          if [ "$AVAILABLE" = "true" ]; then
            echo "line=*${PASSED}* passed · *${FAILED}* failed · *${FLAKY}* flaky" >> "$GITHUB_OUTPUT"
          else
            echo "line=_Result counts unavailable — the report merge did not complete._" >> "$GITHUB_OUTPUT"
          fi

          # Slack rejects a section with empty text, so this must never be blank
          # — and it is blank whenever the merge job failed before the stats step.
          if [ -z "$FAILURES" ]; then
            FAILURES="_No details available — the report merge did not complete, so there is nothing to read the errors from. See the run log._"
          fi
          printf '%s\n' "failures=${FAILURES}" >> "$GITHUB_OUTPUT"

          # A forced notification on a green run must not look like a real
          # alert, or someone will go chasing a failure that never happened.
          if [ "$TEST_RESULT" = "failure" ] || [ "$MERGE_RESULT" = "failure" ]; then
            echo "header=🔴 Playwright Tests — FAILED" >> "$GITHUB_OUTPUT"
            echo "fallback=🔴 Playwright Tests failed — run #${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "header=🧪 Playwright Tests — test notification" >> "$GITHUB_OUTPUT"
            echo "fallback=🧪 Playwright Tests test notification — run #${RUN_NUMBER}, nothing failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        if: steps.check.outputs.configured == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.summary.outputs.fallback }}",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "${{ steps.summary.outputs.header }}" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Run*\n#${{ github.run_number }} (${{ github.event_name }})" },
                    { "type": "mrkdwn", "text": "*Results*\n${{ steps.summary.outputs.line }}" }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "${{ steps.summary.outputs.failures }}" }
                },
                {
                  "type": "actions",
                  "elements": ${{ steps.summary.outputs.buttons }}
                }
              ]
            }
